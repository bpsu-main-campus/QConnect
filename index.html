<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QConnect - BPSU Main Campus</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">

        <div class="header-left">

            <div class="logo-placeholder">

                <img src="images/bpsu-logo.png" alt="BPSU Logo">

            </div>


            <div class="university-name">

                <p class="republic">
                    REPUBLIC OF THE PHILIPPINES
                </p>

                <h1>
                    BATAAN PENINSULA STATE UNIVERSITY
                </h1>

                <span>
                    CITY OF BALANGA, BATAAN 2100
                </span>

            </div>

        </div>


        <!-- HEADER LOGIN -->

        <button class="login-button" id="headerLogin">
            Log-in
        </button>

    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <div class="hero-overlay">

                <h2>
                    Welcome to BPSU -<br>
                    Main Campus!
                </h2>

                <p>
                    ANNOUNCEMENTS
                </p>

            </div>

        </section>



        <!-- ENROLLMENT ADVISORY -->

        <section class="advisory">

            <h2>
                Enrollment Advisory
            </h2>

            <p>
                Start your journey at BPSU – Main Campus.<br>
                Enroll now and be one of us, Peninsulares!
            </p>


            <div class="advisory-buttons">

                <button id="registerButton">
                    Register now
                </button>

                <button id="loginButton">
                    Log-in now
                </button>

            </div>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    

<footer class="site-footer">

    <div class="contact-section">
        <div class="contact-box">

            <!-- FACEBOOK -->
            <a class="contact-icon"
               href="https://www.facebook.com/share/1C3uCueqKy/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="BPSU Facebook Page">
                <span class="facebook-f">f</span>
            </a>

            <a class="contact-label"
               href="https://www.facebook.com/share/1C3uCueqKy/"
               target="_blank"
               rel="noopener noreferrer">
                FB Page
            </a>

            <!-- EMAIL -->
            <a class="contact-icon"
               href="mailto:pio_mc@bpsu.edu.ph"
               aria-label="Email BPSU">
                <span class="email-symbol">✉</span>
            </a>

            <a class="contact-label"
               href="mailto:pio_mc@bpsu.edu.ph">
                Email us
            </a>

        </div>
    </div>

    <!-- FADED BPSU LOGO ON THE RIGHT -->
    <div class="footer-logo">
        <img src="images/bpsu-logo.png" alt="BPSU Logo">
    </div>



    <!-- =========================
         LOGIN ROLE MODAL
    ========================== -->

    <div class="login-modal" id="loginModal">

        <div class="login-modal-box">


            <button
                class="close-modal"
                id="closeModal">
                &times;
            </button>


            <h2>
                Are you?
            </h2>


            <div class="role-buttons">

                <button id="adminButton">
                    Admin
                </button>

                <button id="studentButton">
                    Student
                </button>

            </div>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
