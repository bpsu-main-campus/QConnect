
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QConnect - BPSU Main Campus</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================
           PAGE LAYOUT
        ===================================== */
        html,
        body {
            width: 100%;
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #eeeeee;
        }

        body > header.top-header {
            flex: 0 0 auto;
            width: 100%;
            min-height: 115px;
            height: 115px;
            box-sizing: border-box;
        }

        body > main {
    flex: 1 0 auto;
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

body > main .hero {
    flex-shrink: 0;
}

body > main .advisory {
    flex: 1 0 auto;
}

        body > footer.site-footer {
            flex: 0 0 auto;
            width: 100%;
            min-height: 82px;
            height: auto;
            margin-top: 0;
            box-sizing: border-box;
        }

/* Make the empty space cream instead of gray */
body {
    background: #fff8f0 !important;
}

body > main {
    background: #fff8f0;
    flex-grow: 1;
}

/* Keep the footer pink */
body > footer.site-footer {
    background: #e8d1d1;
}

        /* =====================================
           HEADER AND UNIVERSITY LOGO
        ===================================== */
        .top-header .logo-placeholder {
            width: 82px;
            height: 115px;
            flex-shrink: 0;
        }

        .top-header .logo-placeholder img {
            width: 70px;
            height: 100px;
            object-fit: contain;
        }

        .top-header .university-name {
            min-width: 0;
            margin-left: 8px;
        }

        .top-header .university-name p {
            font-size: 12px;
        }

        .top-header .university-name h1 {
            font-size: clamp(16px, 1.8vw, 23px);
            line-height: 1.25;
        }

        .top-header .university-name span {
            font-size: 11px;
        }

        .top-header .login-button {
            padding: 9px 23px;
            font-size: 17px;
        }

        /* =====================================
           HERO SECTION
        ===================================== */
        .hero {
            width: 100%;
            height: clamp(180px, 23vh, 240px);
            margin-top: 12px;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
        }

        .hero-overlay {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-overlay h2 {
            font-size: clamp(21px, 2vw, 25px);
            line-height: 1.25;
            margin-bottom: 22px;
        }

        .hero-overlay p {
            font-size: clamp(13px, 1.2vw, 15px);
            line-height: 1.5;
        }

        /* =====================================
           ENROLLMENT ADVISORY
        ===================================== */
        .advisory {
            width: 100%;
            min-height: 155px;
            height: auto;
            padding: 22px 15px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .advisory h2 {
            font-size: clamp(20px, 1.8vw, 24px);
            line-height: 1.25;
            margin: 0 0 8px;
        }

        .advisory p {
            font-size: clamp(12px, 1.1vw, 14px);
            line-height: 1.5;
            margin: 0 0 14px;
        }

        .advisory-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 30px;
            margin-top: 0;
        }

        .advisory-buttons button {
            font-size: 12px;
            padding: 9px 18px;
        }

        /* =====================================
           FOOTER CONTACT LINKS
        ===================================== */
        .contact-box {
            grid-template-columns: 65px 115px;
            grid-template-rows: 40px 40px;
        }

        .contact-icon {
            width: 65px;
            height: 40px;
        }

        .facebook-f {
            font-size: 27px;
        }

        .email-symbol {
            font-size: 19px;
        }

        .contact-section a.contact-label {
            font-size: 12px;
            padding-left: 7px;
        }

        /* =====================================
           FOOTER UNIVERSITY LOGO
        ===================================== */
        .footer-logo {
            width: 68px;
            height: 68px;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .footer-logo img {
            width: 68px;
            height: 68px;
            object-fit: contain;
        }

        /* =====================================
           LOGIN MODAL
        ===================================== */
        .login-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .login-modal.active {
            display: flex;
        }

        .login-modal-box {
            max-width: calc(100vw - 32px);
            box-sizing: border-box;
        }

        /* =====================================
           TABLETS AND MOBILE PHONES
        ===================================== */
        @media (max-width: 600px) {
            body > header.top-header {
                min-height: 95px;
                height: auto;
            }

            .top-header .logo-placeholder {
                width: 58px;
                height: 95px;
            }

            .top-header .logo-placeholder img {
                width: 50px;
                height: 80px;
            }

            .top-header .university-name {
                margin-left: 5px;
                max-width: calc(100vw - 135px);
            }

            .top-header .university-name p,
            .top-header .university-name span {
                font-size: 8px;
            }

            .top-header .university-name h1 {
                font-size: clamp(10px, 2.8vw, 14px);
                line-height: 1.2;
                white-space: normal;
            }

            .top-header .login-button {
                top: 12px;
                right: 8px;
                padding: 6px 10px;
                font-size: 11px;
            }

            .hero {
                height: 190px;
                margin-top: 10px;
            }

            .hero-overlay h2 {
                font-size: 21px;
                margin-bottom: 20px;
            }

            .hero-overlay p {
                font-size: 12px;
                padding: 0 10px;
            }

            .advisory {
                min-height: 155px;
                padding: 20px 12px;
            }

            .advisory h2 {
                font-size: 20px;
            }

            .advisory p {
                font-size: 12px;
            }

            .advisory-buttons {
                gap: 12px 18px;
            }

            .advisory-buttons button {
                font-size: 11px;
                padding: 8px 13px;
            }

            body > footer.site-footer {
                min-height: 65px;
            }

            .contact-box {
                grid-template-columns: 45px 85px;
                grid-template-rows: 32px 32px;
            }

            .contact-icon {
                width: 45px;
                height: 32px;
            }

            .facebook-f {
                font-size: 23px;
            }

            .email-symbol {
                font-size: 16px;
            }

            .contact-section a.contact-label {
                font-size: 10px;
                padding-left: 5px;
            }

            .footer-logo {
                width: 45px;
                height: 45px;
                margin-right: 8px;
            }

            .footer-logo img {
                width: 45px;
                height: 45px;
            }

            .login-modal-box {
                width: 280px;
                height: 170px;
            }

            .role-buttons {
                gap: 25px;
            }
        }

        @media (max-width: 360px) {
            .top-header .university-name h1 {
                font-size: 10px;
            }

            .top-header .login-button {
                font-size: 10px;
                padding: 5px 8px;
            }

            .hero-overlay h2 {
                font-size: 19px;
            }

            .advisory-buttons {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="header-left">
            <div class="logo-placeholder">
                <img src="images/bpsu-logo.png" alt="BPSU Logo">
            </div>

            <div class="university-name">
                <p class="republic">REPUBLIC OF THE PHILIPPINES</p>
                <h1>BATAAN PENINSULA STATE UNIVERSITY</h1>
                <span>CITY OF BALANGA, BATAAN 2100</span>
            </div>
        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="hero">
            <div class="hero-overlay">
                <h2>Welcome to BPSU -<br>Main Campus!</h2>
                <p>ANNOUNCEMENTS</p>
            </div>
        </section>

        <section class="advisory">
            <h2>Enrollment Advisory</h2>

            <p>
                Start your journey at BPSU – Main Campus.<br>
                Enroll now and be one of us, Peninsulares!
            </p>

            <div class="advisory-buttons">
                <button id="registerButton" type="button">
                    Register now
                </button>

                <button id="loginButton" type="button">
                    Log-in now
                </button>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="contact-section">
            <div class="contact-box">
                <a class="contact-icon"
                   href="https://www.facebook.com/share/1C3uCueqKy/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="BPSU Facebook Page">
                    <span class="facebook-f">f</span>
                </a>

                <a class="contact-label"
                   href="https://www.facebook.com/share/1C3uCueqKy/"
                   target="_blank"
                   rel="noopener noreferrer">FB Page</a>

                
<!-- EMAIL ICON -->
<a class="contact-icon email-link"
   href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mcregistrarhelpdesk%40bpsu.edu.ph"
   aria-label="Email the Registrar">
    <span class="email-symbol">✉</span>
</a>

<!-- EMAIL LABEL -->
<a class="contact-label email-link"
   href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mcregistrarhelpdesk%40bpsu.edu.ph">
    Email us
</a>

            </div>
        </div>

        <div class="footer-logo">
            <img src="images/bpsu-logo.png" alt="BPSU Logo">
        </div>
    </footer>

    <!-- LOGIN ROLE MODAL -->
    <div class="login-modal" id="loginModal">
        <div class="login-modal-box">
            <button class="close-modal" id="closeModal" type="button">
                &times;
            </button>

            <h2>Are you?</h2>

            <div class="role-buttons">
                <button id="adminButton" type="button">Admin</button>
                <button id="studentButton" type="button">Student</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
