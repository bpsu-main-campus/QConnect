
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QConnect - BPSU Main Campus</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================
           PAGE LAYOUT AND BOTTOM GAP FIX
        ===================================== */
        html {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            width: 100%;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: #eeeeee;
        }

        .top-header {
            flex: 0 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        body > main {
            flex: 1 0 auto;
            width: 100%;
            min-width: 0;
        }

        body > footer.site-footer {
            flex: 0 0 auto;
            width: 100%;
            min-height: 65px;
            height: auto;
            margin-top: 0;
            box-sizing: border-box;
            position: relative;
        }

        /* =====================================
           HERO SECTION
        ===================================== */
        .hero {
            width: 100%;
            height: clamp(180px, 23vh, 240px);
            margin-top: 12px;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
        }

        .hero-overlay {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-overlay h2 {
            font-size: clamp(21px, 2vw, 25px);
            line-height: 1.25;
            margin-bottom: 22px;
        }

        .hero-overlay p {
            font-size: clamp(13px, 1.2vw, 15px);
            line-height: 1.5;
        }

        /* =====================================
           ENROLLMENT ADVISORY
        ===================================== */
        .advisory {
            width: 100%;
            min-height: 155px;
            height: auto;
            padding: 22px 15px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .advisory h2 {
            font-size: clamp(20px, 1.8vw, 24px);
            line-height: 1.25;
            margin: 0 0 8px;
        }

        .advisory p {
            font-size: clamp(12px, 1.1vw, 14px);
            line-height: 1.5;
            margin: 0 0 14px;
        }

        .advisory-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px 30px;
            margin-top: 0;
        }

        .advisory-buttons button {
            font-size: 12px;
            padding: 9px 18px;
        }

        /* =====================================
           FOOTER
        ===================================== */
        .contact-section {
            box-sizing: border-box;
        }

        .contact-box {
            grid-template-columns: 55px minmax(85px, 110px);
            grid-template-rows: 32px 32px;
        }

        .contact-icon {
            width: 55px;
            height: 32px;
        }

        .contact-section a.contact-label {
            font-size: 11px;
            padding-left: 5px;
        }

        .footer-logo {
            width: 55px;
            height: 55px;
            margin-right: 15px;
        }

        .footer-logo img {
            width: 55px;
            height: 55px;
        }

        /* =====================================
           LOGIN MODAL
        ===================================== */
        .login-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .login-modal.active {
            display: flex;
        }

        .login-modal-box {
            max-width: calc(100vw - 32px);
            box-sizing: border-box;
        }

        /* =====================================
           TABLETS AND MOBILE PHONES
        ===================================== */
        @media (max-width: 600px) {
            .top-header {
                min-height: 90px;
                height: auto;
            }

            .logo-placeholder {
                width: 55px;
                height: 90px;
            }

            .logo-placeholder img {
                width: 48px;
                height: 75px;
            }

            .university-name {
                min-width: 0;
                max-width: calc(100vw - 135px);
                margin-left: 5px;
            }

            .university-name p,
            .university-name span {
                font-size: 8px;
            }

            .university-name h1 {
                font-size: clamp(10px, 2.8vw, 14px);
                line-height: 1.2;
                white-space: normal;
            }

            .login-button {
                top: 12px;
                right: 8px;
                padding: 6px 10px;
                font-size: 11px;
            }

            .hero {
                height: 190px;
                margin-top: 10px;
                background-size: cover;
            }

            .hero-overlay h2 {
                font-size: 21px;
                margin-bottom: 20px;
            }

            .hero-overlay p {
                font-size: 12px;
                padding: 0 10px;
            }

            .advisory {
                min-height: 155px;
                padding: 20px 12px;
            }

            .advisory h2 {
                font-size: 20px;
            }

            .advisory p {
                font-size: 12px;
            }

            .advisory-buttons {
                gap: 12px 18px;
            }

            .advisory-buttons button {
                font-size: 11px;
                padding: 8px 13px;
            }

            .contact-box {
                grid-template-columns: 42px 80px;
                grid-template-rows: 30px 30px;
            }

            .contact-icon {
                width: 42px;
                height: 30px;
            }

            .contact-section a.contact-label {
                font-size: 10px;
            }

            .footer-logo {
                width: 42px;
                height: 42px;
                margin-right: 8px;
            }

            .footer-logo img {
                width: 42px;
                height: 42px;
            }

            .login-modal-box {
                width: 280px;
                height: 170px;
            }

            .role-buttons {
                gap: 25px;
            }
        }

        @media (max-width: 360px) {
            .university-name h1 {
                font-size: 10px;
            }

            .login-button {
                font-size: 10px;
                padding: 5px 8px;
            }

            .hero-overlay h2 {
                font-size: 19px;
            }

            .advisory-buttons {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="header-left">
            <div class="logo-placeholder">
                <img src="images/bpsu-logo.png" alt="BPSU Logo">
            </div>

            <div class="university-name">
                <p class="republic">REPUBLIC OF THE PHILIPPINES</p>
                <h1>BATAAN PENINSULA STATE UNIVERSITY</h1>
                <span>CITY OF BALANGA, BATAAN 2100</span>
            </div>
        </div>

        <button class="login-button" id="headerLogin" type="button">
            Log-in
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="hero">
            <div class="hero-overlay">
                <h2>Welcome to BPSU -<br>Main Campus!</h2>
                <p>ANNOUNCEMENTS</p>
            </div>
        </section>

        <section class="advisory">
            <h2>Enrollment Advisory</h2>

            <p>
                Start your journey at BPSU – Main Campus.<br>
                Enroll now and be one of us, Peninsulares!
            </p>

            <div class="advisory-buttons">
                <button id="registerButton" type="button">
                    Register now
                </button>

                <button id="loginButton" type="button">
                    Log-in now
                </button>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="contact-section">
            <div class="contact-box">
                <a class="contact-icon"
                   href="https://www.facebook.com/share/1C3uCueqKy/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="BPSU Facebook Page">
                    <span class="facebook-f">f</span>
                </a>

                <a class="contact-label"
                   href="https://www.facebook.com/share/1C3uCueqKy/"
                   target="_blank"
                   rel="noopener noreferrer">FB Page</a>

                <a class="contact-icon"
                   href="mailto:pio_mc@bpsu.edu.ph"
                   aria-label="Email BPSU">
                    <span class="email-symbol">✉</span>
                </a>

                <a class="contact-label"
                   href="mailto:pio_mc@bpsu.edu.ph">Email us</a>
            </div>
        </div>

        <div class="footer-logo">
            <img src="images/bpsu-logo.png" alt="BPSU Logo">
        </div>
    </footer>

    <!-- LOGIN ROLE MODAL -->
    <div class="login-modal" id="loginModal">
        <div class="login-modal-box">
            <button class="close-modal" id="closeModal" type="button">
                &times;
            </button>

            <h2>Are you?</h2>

            <div class="role-buttons">
                <button id="adminButton" type="button">Admin</button>
                <button id="studentButton" type="button">Student</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
