
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QConnect Notifications</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main style="padding: 24px 0;">

        <!-- Notification message -->
        <div
            id="notification"
            class="notification"
            role="status"
            aria-live="polite"
        >
            <span id="notificationMessage"></span>

            <button
                type="button"
                id="closeNotification"
                aria-label="Close notification"
            >
                ×
            </button>
        </div>

        <!-- Notification test section -->
        <section style="text-align: center; padding: 20px;">

            <h2 style="margin-bottom: 12px;">
                QConnect Notification Test
            </h2>

            <p style="margin-bottom: 16px;">
                Click the button below to test the notification.
            </p>

            <button
                type="button"
                id="testNotification"
                style="
                    background: #651515;
                    color: white;
                    border: none;
                    border-radius: 18px;
                    padding: 10px 18px;
                    cursor: pointer;
                "
            >
                Test Notification
            </button>

        </section>

    </main>

    <!-- Notification JavaScript -->
    <script src="notification.js"></script>

</body>
</html>
