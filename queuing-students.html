<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Queuing Students - QConnect</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <main
        style="
            min-height: 100vh;
            background: #fff8f0;
            padding: 40px 20px;
        ">


        <h2
            style="
                text-align: center;
                color: #651515;
                margin-bottom: 10px;
            ">

            Queuing Students

        </h2>


        <p
            id="queueDateTitle"
            style="
                text-align: center;
                color: #651515;
                margin-bottom: 25px;
            ">

        </p>


        <div
            id="queueContainer"
            style="
                max-width: 900px;
                margin: auto;
                overflow-x: auto;
            ">

        </div>


        <br>


        <button
            onclick="window.location.href='admin-dashboard.html'"
            style="
                display: block;
                margin: 20px auto;
                padding: 10px 25px;
                background: #651515;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            ">

            Back to Dashboard

        </button>


    </main>


    <script src="queuing-students.js"></script>

</body>

</html>
