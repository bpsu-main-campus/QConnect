<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Login - QConnect</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .login-page {

            min-height: calc(100vh - 170px);

            background: #fff8f0;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

        }


        .login-box {

            width: 330px;

            background: #fff8f0;

            border: 4px solid #651515;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.15);

        }


        .login-box h2 {

            font-family: Georgia, serif;

            text-align: center;

            color: #651515;

            margin-bottom: 25px;

        }


        .login-box label {

            display: block;

            color: #651515;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .login-box input {

            width: 100%;

            height: 35px;

            border: 1px solid #8a1f1f;

            border-radius: 8px;

            padding: 8px;

            margin-bottom: 18px;

            outline: none;

        }


        .login-box input:focus {

            border: 2px solid #651515;

        }


        .login-submit {

            display: block;

            margin: 5px auto 0;

            background: #651515;

            color: white;

            border: none;

            border-radius: 18px;

            padding: 9px 22px;

            font-size: 12px;

            cursor: pointer;

        }


        .login-submit:hover {

            background: #4d1010;

        }


        .back-button {

            display: block;

            margin: 18px auto 0;

            background: transparent;

            color: #651515;

            border: none;

            text-decoration: underline;

            cursor: pointer;

            font-size: 11px;

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">

        <div class="header-left">

            <div class="logo-placeholder">

                <img
                    src="images/bpsu-logo.png"
                    alt="BPSU Logo">

            </div>


            <div class="university-name">

                <p class="republic">
                    REPUBLIC OF THE PHILIPPINES
                </p>

                <h1>
                    BATAAN PENINSULA STATE UNIVERSITY
                </h1>

                <span>
                    CITY OF BALANGA, BATAAN 2100
                </span>

            </div>

        </div>

    </header>



    <!-- =========================
         STUDENT LOGIN
    ========================== -->

    <main class="login-page">

        <div class="login-box">

            <h2>
                Student Login
            </h2>


            <form id="studentLoginForm">


                <!-- STUDENT ID -->

                <label for="studentID">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentID"
                    placeholder="00-00000"
                    pattern="[0-9]{2}-[0-9]{5}"
                    title="Student ID must be in the format 00-00000"
                    required
                >


                <!-- PASSWORD -->

                <label for="studentPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="studentPassword"
                    placeholder="MM-DD-YYYY"
                    required
                >


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-submit">

                    Log in now

                </button>

            </form>


            <!-- BACK -->

            <button
                class="back-button"
                id="backButton">

                Back

            </button>

        </div>

    </main>



        <!-- =========================
         FOOTER
    ========================== -->

    

<footer class="site-footer">

    <div class="contact-section">
        <div class="contact-box">

            <!-- FACEBOOK -->
            <a class="contact-icon"
               href="https://www.facebook.com/share/1C3uCueqKy/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="BPSU Facebook Page">
                <span class="facebook-f">f</span>
            </a>

            <a class="contact-label"
               href="https://www.facebook.com/share/1C3uCueqKy/"
               target="_blank"
               rel="noopener noreferrer">
                FB Page
            </a>

            <!-- EMAIL -->
            <a class="contact-icon"
               href="mailto:pio_mc@bpsu.edu.ph"
               aria-label="Email BPSU">
                <span class="email-symbol">✉</span>
            </a>

            <a class="contact-label"
               href="mailto:pio_mc@bpsu.edu.ph">
                Email us
            </a>

        </div>
    </div>


        <div class="footer-logo">

            <img
                src="images/bpsu-logo.png"
                alt="BPSU Logo">

        </div>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="student-login.js"></script>

</body>

</html>
