
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - QConnect</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .profile-page {
            min-height: calc(100vh - 170px);
            background:
                linear-gradient(rgba(75,25,25,.45), rgba(75,25,25,.45)),
                url("images/campus.png") center/cover;
            padding: 35px 15px;
            box-sizing: border-box;
        }

        .profile-title {
            text-align: center;
            color: white;
            font-family: Georgia, serif;
            margin: 0 0 25px;
        }

        .profile-box {
            width: min(100%, 650px);
            box-sizing: border-box;
            margin: auto;
            padding: 25px;
            background: #fff8f0;
            border: 4px solid #651515;
            border-radius: 18px;
        }

        .profile-field {
            margin-bottom: 15px;
        }

        .profile-field > label,
        .name-fields label {
            display: block;
            color: #651515;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .profile-field input,
        .profile-field select {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #b99b9b;
            border-radius: 6px;
            background: white;
            color: #651515;
            font: inherit;
        }

        .profile-field input:disabled,
        .profile-field select:disabled {
            background: #e8d1d1;
            color: #651515;
            opacity: 1;
            cursor: not-allowed;
        }

        .name-fields {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .profile-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 22px;
        }

        .profile-buttons button {
            background: #651515;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            cursor: pointer;
            font-size: 13px;
        }

        .profile-buttons button:hover {
            background: #4d1010;
        }

        #savePopup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 999;
        }

        #savePopup.show {
            display: flex;
        }

        .save-popup-box {
            width: min(100%, 300px);
            padding: 25px;
            background: #fff8f0;
            border: 3px solid #651515;
            border-radius: 15px;
            text-align: center;
            color: #651515;
        }

        .save-popup-box button {
            margin-top: 12px;
            padding: 8px 22px;
            background: #651515;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .profile-box {
                padding: 18px 13px;
            }

            .name-fields {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <header class="top-header">
        <div class="header-left">
            <div class="logo-placeholder">
                <img src="images/bpsu-logo.png" alt="BPSU Logo">
            </div>

            <div class="university-name">
                <p class="republic">REPUBLIC OF THE PHILIPPINES</p>
                <h1>BATAAN PENINSULA STATE UNIVERSITY</h1>
                <span>CITY OF BALANGA, BATAAN 2100</span>
            </div>
        </div>

        <button class="login-button" type="button"
                onclick="window.location.href='index.html'">
            Menu
        </button>
    </header>

    <main class="profile-page">
        <h2 class="profile-title" id="profilePageTitle">My Profile</h2>

        <form class="profile-box" id="profileForm">
            <div class="profile-field">
                <label>Name</label>

                <div class="name-fields">
                    <div>
                        <label for="profileLastName">Last Name</label>
                        <input id="profileLastName" type="text"
                               autocomplete="family-name" disabled required>
                    </div>

                    <div>
                        <label for="profileFirstName">First Name</label>
                        <input id="profileFirstName" type="text"
                               autocomplete="given-name" disabled required>
                    </div>

                    <div>
                        <label for="profileMiddleName">Middle Name</label>
                        <input id="profileMiddleName" type="text"
                               autocomplete="additional-name" disabled>
                    </div>
                </div>
            </div>

            <div class="profile-field">
                <label for="profileStudentID">Student ID</label>
                <input id="profileStudentID" type="text" disabled>
            </div>

            <div class="profile-field">
                <label for="profileGender">Gender</label>
                <input id="profileGender" type="text" disabled>
            </div>

            <div class="profile-field">
                <label for="profileBirthday">Birthday (MM/DD/YYYY)</label>
                <input id="profileBirthday" type="text"
                       placeholder="MM/DD/YYYY" disabled>
            </div>

            <div class="profile-field">
                <label for="profileAge">Age</label>
                <input id="profileAge" type="text" disabled>
            </div>

            <div class="profile-field">
                <label for="profileCampus">Campus</label>
                <input id="profileCampus" type="text" disabled>
            </div>

            <div class="profile-field">
                <label for="profileCollege">College</label>
                <select id="profileCollege" disabled required>
                    <option value="">Select College</option>
                    <option value="CCST">College of Computer Studies and Technology (CCST)</option>
                    <option value="CEA">College of Engineering and Architecture (CEA)</option>
                    <option value="CBA">College of Business and Accountancy (CBA)</option>
                    <option value="COAS">College of Arts and Sciences (COAS)</option>
                    <option value="CAHS">College of Allied Health Sciences (CAHS)</option>
                    <option value="CTECH">College of Technology (CTECH)</option>
                </select>
            </div>

            <div class="profile-field">
                <label for="profileCourse">Course</label>
                <select id="profileCourse" disabled required>
                    <option value="">Select Course</option>
                </select>
            </div>

            <div class="profile-field">
                <label for="profileProgram">Program / Major</label>
                <select id="profileProgram" disabled required>
                    <option value="">Select Program / Major</option>
                </select>
            </div>

            <div class="profile-buttons" id="profileButtons">
                <button type="button" id="editProfileButton">Edit Profile</button>
                <button type="submit" id="saveProfileButton" hidden>Save Changes</button>
                <button type="button" id="queueButton">Get Queue</button>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <div class="contact-section">
            <div class="contact-box">
                <a class="contact-icon"
                   href="https://www.facebook.com/share/1C3uCueqKy/"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="BPSU Facebook Page">
                    <span class="facebook-f">f</span>
                </a>

                <a class="contact-label"
                   href="https://www.facebook.com/share/1C3uCueqKy/"
                   target="_blank" rel="noopener noreferrer">FB Page</a>

                <a class="contact-icon email-link"
                   href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mcregistrarhelpdesk%40bpsu.edu.ph"
                   aria-label="Email the Registrar">
                    <span class="email-symbol">✉</span>
                </a>

                <a class="contact-label email-link"
                   href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mcregistrarhelpdesk%40bpsu.edu.ph">
                    Email us
                </a>
            </div>
        </div>

        <div class="footer-logo">
            <img src="images/bpsu-logo.png" alt="BPSU Logo">
        </div>
    </footer>

    <div id="savePopup" role="dialog" aria-modal="true"
         aria-labelledby="savePopupTitle">
        <div class="save-popup-box">
            <h3 id="savePopupTitle">Profile Saved!</h3>
            <p>Your profile has been updated successfully.</p>
            <button type="button" id="closeSavePopup">OK</button>
        </div>
    </div>

    <script src="student-profile.js?v=5"></script>
</body>
</html>
