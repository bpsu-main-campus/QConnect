<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - BPSU</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">

        <div class="header-left">

            <div class="logo-placeholder">

                <img
                    src="images/bpsu-logo.png"
                    alt="BPSU Logo">

            </div>


            <div class="university-name">

                <p class="republic">
                    REPUBLIC OF THE PHILIPPINES
                </p>

                <h1>
                    BATAAN PENINSULA STATE UNIVERSITY
                </h1>

                <span>
                    CITY OF BALANGA, BATAAN 2100
                </span>

            </div>

        </div>


        <button
            class="login-button"
            onclick="window.location.href='index.html'">

            Log-in

        </button>

    </header>



    <!-- =========================
         PAGE TITLE
    ========================== -->

    <section class="page-title">

        <h2>
            Student Registration
        </h2>

    </section>



    <!-- =========================
         REGISTRATION AREA
    ========================== -->

    <main class="registration-page">


        <form
            id="registrationForm"
            class="registration-box">


            <h2>
                Register Student
            </h2>



            <!-- STUDENT ID -->

            <label for="studentID">
                Student ID
            </label>

            <input
                type="text"
                id="studentID"
                placeholder="00-00000"
                required>



            <!-- NAME -->

            <label>
                Name
            </label>

            <div class="name-inputs">

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last Name"
                    required>

                <input
                    type="text"
                    id="firstName"
                    placeholder="First Name"
                    required>

                <input
                    type="text"
                    id="middleName"
                    placeholder="Middle Name">

            </div>



            <!-- GENDER -->

            <label>Gender</label>

<select id="gender" required>
    <option value="" disabled selected>Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>
            <!-- BIRTHDAY -->

            <label for="birthday">
                Birthday
            </label>

            <input
                type="date"
                id="birthday"
                required>



            <!-- COURSE -->

            <label for="course">
    Course
</label>

<select id="course" required>

    <option value="" disabled selected>
        Select Course
    </option>

    <option value="Bachelor of Science in Midwifery">
        Bachelor of Science in Midwifery
    </option>

    <option value="Bachelor of Science in Nursing">
        Bachelor of Science in Nursing
    </option>

    <option value="Bachelor of Science in Public Health">
        Bachelor of Science in Public Health
    </option>

    <option value="Bachelor of Science in Radiologic Technology">
        Bachelor of Science in Radiologic Technology
    </option>

    <option value="Bachelor of Arts in Communication">
        Bachelor of Arts in Communication
    </option>

    <option value="Bachelor of Science in Hospitality Management">
        Bachelor of Science in Hospitality Management
    </option>

    <option value="Bachelor of Science in Tourism Management">
        Bachelor of Science in Tourism Management
    </option>

    <option value="Bachelor of Science in Architecture">
        Bachelor of Science in Architecture
    </option>

    <option value="Bachelor of Science in Civil Engineering">
        Bachelor of Science in Civil Engineering
    </option>

    <option value="Bachelor of Science in Computer Engineering">
        Bachelor of Science in Computer Engineering
    </option>

    <option value="Bachelor of Science in Electrical Engineering">
        Bachelor of Science in Electrical Engineering
    </option>

    <option value="Bachelor of Science in Electronics Engineering">
        Bachelor of Science in Electronics Engineering
    </option>

    <option value="Bachelor of Science in Industrial Engineering">
        Bachelor of Science in Industrial Engineering
    </option>

    <option value="Bachelor of Science in Mechanical Engineering">
        Bachelor of Science in Mechanical Engineering
    </option>

    <option value="Bachelor of Science in Computer Science">
        Bachelor of Science in Computer Science
    </option>

    <option value="Bachelor of Science in Data Science">
        Bachelor of Science in Data Science
    </option>

    <option value="Bachelor of Science in Entertainment and Multimedia Computing">
        Bachelor of Science in Entertainment and Multimedia Computing
    </option>

    <option value="Bachelor of Science in Information Technology">
        Bachelor of Science in Information Technology
    </option>

    <option value="Bachelor of Science in Industrial Technology">
        Bachelor of Science in Industrial Technology
    </option>

    <option value="Bachelor of Technical-Vocational Teacher Education">
        Bachelor of Technical-Vocational Teacher Education
    </option>

</select>



            <!-- PROGRAM -->

            <label for="program">
                Program
            </label>

            <select
                id="program"
                required
                disabled>

                <option
                    value=""
                    selected>

                    Select Course First

                </option>

            </select>



            <!-- REGISTER -->

            <button
                type="submit"
                class="register-submit">

                Register Now

            </button>


        </form>


    </main>



        <!-- =========================
         FOOTER
    ========================== -->

    

<footer class="site-footer">

    <div class="contact-section">
        <div class="contact-box">

            <!-- FACEBOOK -->
            <a class="contact-icon"
               href="https://www.facebook.com/share/1C3uCueqKy/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="BPSU Facebook Page">
                <span class="facebook-f">f</span>
            </a>

            <a class="contact-label"
               href="https://www.facebook.com/share/1C3uCueqKy/"
               target="_blank"
               rel="noopener noreferrer">
                FB Page
            </a>

            <!-- EMAIL -->
            <a class="contact-icon"
               href="mailto:pio_mc@bpsu.edu.ph"
               aria-label="Email BPSU">
                <span class="email-symbol">✉</span>
            </a>

            <a class="contact-label"
               href="mailto:pio_mc@bpsu.edu.ph">
                Email us
            </a>

        </div>
    </div>


        <div class="footer-logo">

            <img
                src="images/bpsu-logo.png"
                alt="BPSU Logo">

        </div>

    </footer>



    <script src="student-registration.js"></script>

</body>

</html>
