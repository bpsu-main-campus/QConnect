```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - BPSU</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="top-header">
        <div class="header-left">
            <div class="logo-placeholder">
                <img src="images/bpsu-logo.png" alt="BPSU Logo">
            </div>

            <div class="university-name">
                <p class="republic">REPUBLIC OF THE PHILIPPINES</p>
                <h1>BATAAN PENINSULA STATE UNIVERSITY</h1>
                <span>CITY OF BALANGA, BATAAN 2100</span>
            </div>
        </div>

        <button class="login-button" type="button"
            onclick="window.location.href='index.html'">
            Log-in
        </button>
    </header>

    <section class="page-title">
        <h2>Student Registration</h2>
    </section>

    <main class="registration-page">
        <form id="registrationForm" class="registration-box">
            <h2>Register Student</h2>

            <label for="studentID">Student ID</label>
            <input
                type="text"
                id="studentID"
                placeholder="00-00000"
                required
                pattern="[0-9]{2}-[0-9]{5}"
                title="Use the format 00-00000"
            >

            <label>Name</label>
            <div class="name-inputs">
                <input type="text" id="lastName"
                    placeholder="Last Name" required>

                <input type="text" id="firstName"
                    placeholder="First Name" required>

                <input type="text" id="middleName"
                    placeholder="Middle Name">
            </div>

            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="birthday">Birthday</label>
            <input type="date" id="birthday" required>

            <label for="college">College</label>
            <select id="college" name="college" required>
                <option value="" disabled selected>Select College</option>
                <option value="CCST">College of Computer Studies and Technology (CCST)</option>
                <option value="CEA">College of Engineering and Architecture (CEA)</option>
                <option value="Other">Other College</option>
            </select>

            <label for="course">Course</label>
            <select id="course" name="course" required disabled>
                <option value="">Select College First</option>
            </select>

            <div class="program-field">
                <label for="program">Program / Major</label>
                <select id="program" name="program" required disabled>
                    <option value="">Select Course First</option>
                </select>
            </div>

            <label for="representative">Are you a representative?</label>
            <select id="representative" name="representative" required>
                <option value="" disabled selected>Select an option</option>
                <option value="N/A (Student)">N/A (Student)</option>
                <option value="Representative (PWD)">Representative (PWD)</option>
            </select>

            <button type="submit" class="register-submit">
                Register Now
            </button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="contact-section">
            <div class="contact-box">
                <a class="contact-icon"
                    href="https://www.facebook.com/share/1C3uCueqKy/"
                    target="_blank" rel="noopener noreferrer"
                    aria-label="BPSU Facebook Page">
                    <span class="facebook-f">f</span>
                </a>

                <a class="contact-label"
                    href="https://www.facebook.com/share/1C3uCueqKy/"
                    target="_blank" rel="noopener noreferrer">FB Page</a>

                <a class="contact-icon email-link"
                    href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mcregistrarhelpdesk%40bpsu.edu.ph"
                    aria-label="Email the Registrar">
                    <span class="email-symbol">✉</span>
                </a>

                <a class="contact-label email-link"
                    href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=mcregistrarhelpdesk%40bpsu.edu.ph">
                    Email us
                </a>
            </div>
        </div>

        <div class="footer-logo">
            <img src="images/bpsu-logo.png" alt="BPSU Logo">
        </div>
    </footer>

    <script src="student-registration.js?v=3"></script>
</body>
</html>
```
